<div>
  <aside>
    <div>
      <div>SIGEA-GTT</div>
      <div>Hospital Universitário HU-UFS</div>
    </div>

    <nav>
      @for (grupo of gruposMenu(); track grupo.titulo) {
        <div>{{ grupo.titulo }}</div>
        @for (item of grupo.itens; track item.rota) {
          <a
            [routerLink]="item.rota"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.rota === '/atividades' }"
          >
            <span>{{ item.rotulo }}</span>
          </a>
        }
      }
    </nav>

    <div>
      <div>
        <span [title]="nomeUsuario()">{{ nomeUsuario() }}</span>
        <span>[{{ perfilUsuario() }}]</span>
      </div>
      <div>
        <button
          pButton
          type="button"
          label="PERFIL"
          severity="secondary"
          routerLink="/perfil"
        ></button>
        <button pButton type="button" label="SAIR" severity="danger" (click)="sair()"></button>
      </div>
    </div>
  </aside>

  <main>
    <div>
      <div>
        <router-outlet></router-outlet>
      </div>
    </div>
  </main>
</div>
