<div class="flex min-h-screen bg-surface-50 text-surface-900">
  <!-- BACKDROP PARA SIDEBAR MÓVEL -->
  @if (sidebarMobileAberta()) {
    <div
      class="fixed inset-0 bg-black/50 z-30 lg:hidden backdrop-blur-xs transition-opacity"
      (click)="fecharSidebarMobile()"
    ></div>
  }

  <!-- SIDEBAR LATERAL (RESPONSIVA) -->
  <aside
    class="bg-surface-0 border-r border-surface-200 flex flex-col h-screen fixed lg:sticky top-0 z-40 shadow-sm transition-transform duration-300 w-72 shrink-0"
    [class.-translate-x-full]="!sidebarMobileAberta()"
    [class.translate-x-0]="sidebarMobileAberta()"
    [class.lg:translate-x-0]="true"
  >
    <!-- CABEÇALHO DA SIDEBAR -->
    <div class="p-5 border-b border-surface-200/80 flex items-center justify-between bg-surface-0">
      <div class="flex items-center gap-3 min-w-0">
        <div
          class="w-10 h-10 rounded-xl bg-primary/10 border border-primary/20 flex items-center justify-center text-primary shadow-sm shrink-0"
        >
          <i class="pi pi-shield text-xl"></i>
        </div>
        <div class="min-w-0 flex-1">
          <div class="flex items-center gap-2">
            <span class="font-bold text-base tracking-tight text-surface-900">SIGEA-GTT</span>
          </div>
          <p class="text-xs font-semibold text-primary truncate mt-0.5">HU-UFS</p>
        </div>
      </div>
      <!-- BOTÃO FECHAR SIDEBAR NO MOBILE -->
      <button
        type="button"
        class="lg:hidden p-2 text-surface-400 hover:text-surface-600 rounded-lg"
        (click)="fecharSidebarMobile()"
      >
        <i class="pi pi-times text-base"></i>
      </button>
    </div>

    <!-- NAVEGAÇÃO POR GRUPOS -->
    <nav class="overflow-y-auto flex-1 p-4 space-y-6 clinical-pane-scroll">
      @for (grupo of gruposMenu(); track grupo.titulo) {
        <div>
          <div
            class="text-[11px] font-bold text-surface-400 uppercase tracking-wider px-3 mb-2 flex items-center justify-between"
          >
            <span>{{ grupo.titulo }}</span>
            <span class="w-1.5 h-1.5 rounded-full bg-surface-300"></span>
          </div>
          <div class="space-y-1">
            @for (item of grupo.itens; track item.rota) {
              <a
                [routerLink]="item.rota"
                (click)="fecharSidebarMobile()"
                routerLinkActive="!bg-primary !text-primary-contrast shadow-sm font-semibold"
                [routerLinkActiveOptions]="{ exact: item.rota === '/atividades' }"
                class="flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-all duration-200 text-surface-600 hover:bg-surface-100 hover:text-surface-900 group"
              >
                <i
                  [class]="item.icone"
                  class="text-base transition-transform group-hover:scale-110"
                ></i>
                <span class="truncate">{{ item.rotulo }}</span>
              </a>
            }
          </div>
        </div>
      }
    </nav>

    <!-- PAINEL INFERIOR DO USUÁRIO -->
    <div class="p-4 border-t border-surface-200 bg-surface-50/70">
      <div class="flex items-center gap-3 mb-3">
        <p-avatar
          [label]="iniciaisUsuario()"
          shape="circle"
          styleClass="bg-primary text-primary-contrast font-bold text-xs shrink-0"
        />
        <div class="min-w-0 flex-1">
          <div
            class="text-sm font-semibold text-surface-900 truncate"
            [pTooltip]="nomeUsuario()"
            tooltipPosition="top"
          >
            {{ nomeUsuario() }}
          </div>
          <p-tag
            [value]="perfilUsuario()"
            [severity]="
              perfilUsuario() === 'ADMINISTRADOR'
                ? 'danger'
                : perfilUsuario() === 'PROFESSOR'
                  ? 'info'
                  : 'secondary'
            "
            styleClass="text-[10px] px-1.5 py-0 uppercase"
          />
        </div>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <p-button
          icon="pi pi-user"
          label="Perfil"
          size="small"
          [text]="true"
          severity="secondary"
          routerLink="/perfil"
          (onClick)="fecharSidebarMobile()"
          styleClass="w-full text-xs"
        />
        <p-button
          icon="pi pi-sign-out"
          label="Sair"
          size="small"
          [text]="true"
          severity="danger"
          (onClick)="sair()"
          styleClass="w-full text-xs"
        />
      </div>
    </div>
  </aside>

  <!-- ÁREA DE CONTEÚDO PRINCIPAL (SEM HEADER!) -->
  <div class="flex-1 min-w-0 flex flex-col min-h-screen">
    <!-- BOTÃO FLUTUANTE PARA ABRIR SIDEBAR NO MOBILE (CASO FECHADA) -->
    @if (!sidebarMobileAberta()) {
      <div class="lg:hidden fixed top-3 left-3 z-30">
        <p-button
          icon="pi pi-bars"
          [rounded]="true"
          severity="secondary"
          (onClick)="alternarSidebarMobile()"
          aria-label="Abrir Menu"
          styleClass="shadow-md"
        />
      </div>
    }

    <!-- CONTEÚDO DA PÁGINA COM CONTAINER ERGONÔMICO (UTILIZA 100% DA ALTURA DISPONÍVEL) -->
    <main class="flex-1 p-4 md:p-6 lg:p-8 fhd:p-10 qhd:p-12 overflow-x-hidden">
      <div class="app-container">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
