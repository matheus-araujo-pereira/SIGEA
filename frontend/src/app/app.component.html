    class="fixed inset-0 z-50 flex items-center justify-center bg-surface-900/40 backdrop-blur-xs animate-fadein"
  >
    <div
      class="bg-surface-0 border border-surface-300 shadow-lg rounded-none p-6 flex flex-col items-center gap-4 text-center min-w-[260px]"
    >
      <div class="flex items-center gap-2 border-b border-surface-200 pb-2 w-full justify-center font-mono text-[10px] text-surface-500 uppercase tracking-widest font-bold">
        <span class="w-2 h-2 bg-teal-600 inline-block"></span>
        <span>HU-UFS // SISTEMA GTT</span>
      </div>

        <p class="text-[11px] font-mono text-surface-500 mt-0.5">Processando requisição clínica...</p>
      </div>
    </div>
