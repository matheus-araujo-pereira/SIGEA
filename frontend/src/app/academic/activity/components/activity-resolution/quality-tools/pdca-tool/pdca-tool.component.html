    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-xs space-y-4">
      <div>
        <h3 class="text-sm font-black text-slate-900">Ciclo de Melhoria Contínua PDCA / PDSA</h3>
        <p class="text-[11px] text-slate-500 mt-0.5">
          Estruture a melhoria da qualidade nos 4 quadrantes clássicos
        </p>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
        <!-- Plan -->
        <div class="p-4 bg-clinical-50/50 border border-clinical-200 rounded-2xl space-y-2">
          <span class="font-black text-clinical-900 text-xs">P - Plan (Planejar)</span>
          <textarea
            rows="4"
            [disabled]="readOnly"
            [(ngModel)]="pdca.plan"
            (ngModelChange)="dataChange.emit()"
            (input)="onAutoResize($event)"
            placeholder="Problema identificado, objetivos e metas a serem alcançadas..."
            class="w-full px-3.5 py-2.5 bg-white border border-clinical-200 rounded-xl text-xs min-h-[104px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
          ></textarea>
        </div>

        <!-- Do -->
        <div class="p-4 bg-amber-50/50 border border-amber-200 rounded-2xl space-y-2">
          <span class="font-black text-amber-900 text-xs">D - Do (Executar)</span>
          <textarea
            rows="4"
            [disabled]="readOnly"
            [(ngModel)]="pdca.doPhase"
            (ngModelChange)="dataChange.emit()"
            (input)="onAutoResize($event)"
            placeholder="Implementação do plano de ação e execução dos treinamentos..."
            class="w-full px-3.5 py-2.5 bg-white border border-amber-200 rounded-xl text-xs min-h-[104px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-amber-500 disabled:bg-slate-100 disabled:text-slate-600"
          ></textarea>
        </div>

        <!-- Check -->
        <div class="p-4 bg-emerald-50/50 border border-emerald-200 rounded-2xl space-y-2">
          <span class="font-black text-emerald-900 text-xs">C - Check (Checar / Estudar)</span>
          <textarea
            rows="4"
            [disabled]="readOnly"
            [(ngModel)]="pdca.checkPhase"
            (ngModelChange)="dataChange.emit()"
            (input)="onAutoResize($event)"
            placeholder="Auditorias de prontuário, medição de taxas GTT e verificação de resultados..."
            class="w-full px-3.5 py-2.5 bg-white border border-emerald-200 rounded-xl text-xs min-h-[104px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500 disabled:bg-slate-100 disabled:text-slate-600"
          ></textarea>
        </div>

        <!-- Act -->
        <div class="p-4 bg-purple-50/50 border border-purple-200 rounded-2xl space-y-2">
          <span class="font-black text-purple-900 text-xs">A - Act (Agir / Padronizar)</span>
          <textarea
            rows="4"
            [disabled]="readOnly"
            [(ngModel)]="pdca.actPhase"
            (ngModelChange)="dataChange.emit()"
            (input)="onAutoResize($event)"
            placeholder="Padronização do novo procedimento operacional e difusão na equipe..."
            class="w-full px-3.5 py-2.5 bg-white border border-purple-200 rounded-xl text-xs min-h-[104px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-purple-500 disabled:bg-slate-100 disabled:text-slate-600"
          ></textarea>
        </div>
      </div>
    </div>
