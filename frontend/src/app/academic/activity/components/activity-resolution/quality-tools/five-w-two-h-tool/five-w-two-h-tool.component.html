    <div class="bg-white rounded-3xl border border-slate-200/80 p-6 shadow-xs space-y-4">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-sm font-black text-slate-900">Matriz 5W2H (Plano de Ação)</h3>
          <p class="text-[11px] text-slate-500 mt-0.5">
            Defina ações concretas de melhoria assistencial e prevenção de eventos adversos
          </p>
        </div>
        @if (!readOnly) {
          <button
            type="button"
            (click)="addItem.emit()"
            class="px-3 py-1.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs transition-colors shadow-xs"
          >
            + Adicionar Ação
          </button>
        }
      </div>

      <div class="space-y-4">
        @for (item of fiveWTwoHItems; track $index) {
          <div class="p-4 bg-slate-50 border border-slate-200 rounded-2xl relative space-y-4">
            <div class="flex items-center justify-between">
              <span class="text-[11px] font-black uppercase tracking-wider text-slate-500">
                Ação Corretiva #{{ $index + 1 }}
              </span>
              @if (!readOnly) {
                <button
                  type="button"
                  (click)="removeItem.emit($index)"
                  class="text-slate-400 hover:text-rose-500 text-xs font-semibold"
                >
                  Excluir Ação
                </button>
              }
            </div>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 text-xs">
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">O quê (What)?</label>
                <textarea
                  rows="3"
                  [disabled]="readOnly"
                  [(ngModel)]="item.what"
                  (ngModelChange)="dataChange.emit()"
                  (input)="onAutoResize($event)"
                  placeholder="O que será feito?"
                  class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
                ></textarea>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Por quê (Why)?</label>
                <textarea
                  rows="3"
                  [disabled]="readOnly"
                  [(ngModel)]="item.why"
                  (ngModelChange)="dataChange.emit()"
                  (input)="onAutoResize($event)"
                  placeholder="Por que será feito?"
                  class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
                ></textarea>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Onde (Where)?</label>
                <textarea
                  rows="3"
                  [disabled]="readOnly"
                  [(ngModel)]="item.where"
                  (ngModelChange)="dataChange.emit()"
                  (input)="onAutoResize($event)"
                  placeholder="Onde será executado?"
                  class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
                ></textarea>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Quando (When)?</label>
                <textarea
                  rows="3"
                  [disabled]="readOnly"
                  [(ngModel)]="item.when"
                  (ngModelChange)="dataChange.emit()"
                  (input)="onAutoResize($event)"
                  placeholder="Qual o prazo de execução?"
                  class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
                ></textarea>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Quem (Who)?</label>
                <textarea
                  rows="3"
                  [disabled]="readOnly"
                  [(ngModel)]="item.who"
                  (ngModelChange)="dataChange.emit()"
                  (input)="onAutoResize($event)"
                  placeholder="Quem é o responsável?"
                  class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
                ></textarea>
              </div>
              <div>
                <label class="block font-bold text-slate-700 mb-1.5">Como (How)?</label>
                <textarea
                  rows="3"
                  [disabled]="readOnly"
                  [(ngModel)]="item.how"
                  (ngModelChange)="dataChange.emit()"
                  (input)="onAutoResize($event)"
                  placeholder="Qual método / procedimento?"
                  class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
                ></textarea>
              </div>
            </div>
            <div class="text-xs">
              <label class="block font-bold text-slate-700 mb-1.5">Quanto custa (How much)?</label>
              <textarea
                rows="3"
                [disabled]="readOnly"
                [(ngModel)]="item.howMuch"
                (ngModelChange)="dataChange.emit()"
                (input)="onAutoResize($event)"
                placeholder="Custo estimado / Recursos necessários"
                class="w-full px-3.5 py-2.5 bg-white border border-slate-200 rounded-xl text-xs min-h-[84px] resize-y whitespace-pre-wrap break-words leading-relaxed focus:outline-none focus:ring-2 focus:ring-clinical-500 disabled:bg-slate-100 disabled:text-slate-600"
              ></textarea>
            </div>
          </div>
        } @empty {
          <p class="text-center text-slate-400 py-6 text-xs">Nenhuma ação cadastrada no plano 5W2H.</p>
        }
      </div>
    </div>
