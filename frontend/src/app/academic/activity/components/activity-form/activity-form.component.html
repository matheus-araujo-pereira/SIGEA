<div class="space-y-6 max-w-5xl mx-auto">
  <!-- Cabeçalho -->
  <div class="flex items-center justify-between">
    <button
      type="button"
      (click)="goBack()"
      class="inline-flex items-center gap-2 px-3 py-2 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs transition-colors shadow-xs"
    >
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
      </svg>
      <span>Voltar</span>
    </button>

    <h2 class="text-xl font-black text-slate-900">
      {{ isEditMode ? 'Editar Atividade Avaliativa' : 'Nova Atividade com Prontuário Simulado' }}
    </h2>
  </div>

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="space-y-6 text-xs">
    <!-- Card 0: Catálogo de Modelos Clínicos IHI-GTT -->
    <app-template-selector
      [templates]="templates()"
      [selectedTemplateId]="selectedTemplateId()"
      [activeTemplate]="activeTemplate()"
      [isEditMode]="isEditMode"
      (templateChange)="onTemplateSelect($event)"
      (applyTemplate)="applySelectedTemplate()"
    />

    <!-- Card 1: Dados Gerais da Atividade -->
    <app-activity-info-form
      [form]="form"
      [classes]="classes()"
      [isEditMode]="isEditMode"
    />

    <!-- Card 2: Prontuário Simulado - Dados do Paciente e Admissão -->
    <app-patient-demographics-form
      [clinicalCaseGroup]="clinicalCaseGroup"
    />

    <!-- Card 3: Notas de Evolução Médica e de Enfermagem -->
    <app-evolution-notes-editor
      [evolutionNotesArray]="evolutionNotesArray"
      (addNote)="addEvolutionNote()"
      (removeNote)="removeEvolutionNote($event)"
    />

    <!-- Card 4: Prescrições Medicamentosas e Checagem -->
    <app-prescriptions-editor
      [prescriptionsArray]="prescriptionsArray"
      (addPrescription)="addPrescription()"
      (removePrescription)="removePrescription($event)"
    />

    <!-- Card 5: Exames Laboratoriais e Procedimentos -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <app-lab-exams-editor
        [labExamsArray]="labExamsArray"
        (addExam)="addLabExam()"
        (removeExam)="removeLabExam($event)"
      />

      <app-procedures-editor
        [proceduresArray]="proceduresArray"
        (addProcedure)="addProcedure()"
        (removeProcedure)="removeProcedure($event)"
      />
    </div>

    <!-- Botões de Finalização -->
    <div class="flex items-center justify-end gap-3 pt-4">
      <button
        type="button"
        (click)="goBack()"
        class="px-5 py-2.5 rounded-xl border border-slate-200 bg-white hover:bg-slate-50 text-slate-700 font-semibold text-xs transition-colors"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="form.invalid || isSaving()"
        class="px-6 py-2.5 rounded-xl bg-clinical-600 hover:bg-clinical-700 text-white font-bold text-xs disabled:opacity-50 disabled:cursor-not-allowed shadow-md transition-all flex items-center justify-center gap-2"
      >
        @if (isSaving()) {
          <div class="w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          <span>Salvando Atividade...</span>
        } @else {
          <span>{{ isEditMode ? 'Salvar Alterações' : 'Publicar Atividade na Turma' }}</span>
        }
      </button>
    </div>
  </form>
</div>
