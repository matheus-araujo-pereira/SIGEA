<div>
  <!-- CABEÇALHO -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Catálogo de Gatilhos IHI-GTT</h1>
      <span class="page-subtitle"
        >Total cadastrado: {{ totalGatilhos() }} rastreadores de eventos adversos</span
      >
    </div>
    <button pButton type="button" label="NOVO GATILHO" (click)="navegarParaNovo()"></button>
  </div>

  <!-- BARRA DE FILTROS -->
  <div class="filter-card">
    <input
      pInputText
      type="text"
      [ngModel]="termoBusca()"
      (ngModelChange)="termoBusca.set($event)"
      placeholder="Filtrar por código, descrição ou limiar de referência..."
      class="search-input"
    />
    <p-select
      [options]="opcoesModulos()"
      [ngModel]="filtroModuloId()"
      (ngModelChange)="filtroModuloId.set($event)"
      optionLabel="label"
      optionValue="value"
      class="filter-select"
    />
    <p-select
      [options]="opcoesStatus"
      [ngModel]="filtroStatus()"
      (ngModelChange)="filtroStatus.set($event)"
      optionLabel="label"
      optionValue="value"
      class="filter-select"
    />
  </div>

  <!-- TABELA PRIMENG COMPACTA -->
  <p-table
    [value]="gatilhosLinhasFiltradas()"
    styleClass="p-datatable-sm p-datatable-striped w-full"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 25, 50]"
    [loading]="carregando()"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="codigo" class="w-12p">Código <p-sortIcon field="codigo" /></th>
        <th pSortableColumn="moduloNome" class="w-18p">Módulo <p-sortIcon field="moduloNome" /></th>
        <th pSortableColumn="descricao" class="w-38p">
          Descrição Operacional <p-sortIcon field="descricao" />
        </th>
        <th class="w-14p">Limiar</th>
        <th class="w-8p">Status</th>
        <th class="w-10p text-right">Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-g>
      <tr>
        <td>
          <span class="font-bold">{{ g.codigo }}</span>
        </td>
        <td>{{ g.moduloNome }}</td>
        <td>{{ g.descricao }}</td>
        <td>
          <small>{{ g.limiar }}</small>
        </td>
        <td>
          <p-tag
            [value]="g.ativa ? 'ATIVO' : 'INATIVO'"
            [severity]="g.ativa ? 'success' : 'danger'"
          />
        </td>
        <td>
          <div class="actions-cell">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              size="small"
              (click)="navegarParaEditar(g.original)"
              pTooltip="Editar Gatilho"
              tooltipPosition="top"
              aria-label="Editar Gatilho"
            ></button>
            <button
              pButton
              type="button"
              [icon]="g.ativa ? 'pi pi-ban' : 'pi pi-check'"
              [text]="true"
              [severity]="g.ativa ? 'warn' : 'success'"
              size="small"
              (click)="alternarStatus(g.original)"
              [pTooltip]="g.ativa ? 'Inativar Gatilho' : 'Reativar Gatilho'"
              tooltipPosition="top"
              [attr.aria-label]="g.ativa ? 'Inativar Gatilho' : 'Reativar Gatilho'"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-trash"
              [text]="true"
              severity="danger"
              size="small"
              (click)="excluir(g.original)"
              pTooltip="Excluir Gatilho"
              tooltipPosition="top"
              aria-label="Excluir Gatilho"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="text-center p-3 font-normal">
          Nenhum gatilho encontrado com os filtros selecionados.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
