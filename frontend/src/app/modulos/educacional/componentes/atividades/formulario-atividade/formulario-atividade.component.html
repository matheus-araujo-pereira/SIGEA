<div>
  <!-- CABEÇALHO DO FORMULÁRIO -->
  <div>
    <div>
      <h1>{{ tituloPagina() }}</h1>
      <span>{{ subtituloPagina() }}</span>
    </div>
    <p-button
      label="VOLTAR PARA ATIVIDADES"
      [outlined]="true"
      severity="secondary"
      size="small"
      (onClick)="voltarParaListagem()"
    />
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" />
  }

  @if (carregando()) {
    <div>
      <p-progressSpinner strokeWidth="4" />
      <span>Carregando dados da atividade...</span>
    </div>
  } @else {
    <p-card header="Configurações da Atividade Prática">
      <form (ngSubmit)="salvar()">
        <!-- TÍTULO DA ATIVIDADE -->
        <div>
          <label for="titulo"> Título da Atividade * </label>
          <input
            pInputText
            id="titulo"
            type="text"
            [(ngModel)]="formulario.titulo"
            name="titulo"
            placeholder="Ex.: Auditoria de Prontuário 01 - Rastreamento de Gatilhos e Análise 6M"
            required
          />
        </div>

        <!-- TURMA E CASO CLÍNICO -->
        <div>
          <div>
            <label for="turmaId"> Turma Acadêmica * </label>
            <p-select
              inputId="turmaId"
              [options]="turmasOpcoes()"
              optionLabel="label"
              optionValue="value"
              [(ngModel)]="formulario.turmaId"
              name="turmaId"
              placeholder="Selecione a turma..."
            />
          </div>

          <div>
            <label for="casoClinicoId"> Caso Clínico Simulado * </label>
            <p-select
              inputId="casoClinicoId"
              [options]="casosOpcoes()"
              optionLabel="label"
              optionValue="value"
              [(ngModel)]="formulario.casoClinicoId"
              name="casoClinicoId"
              placeholder="Selecione o caso clínico..."
            />
          </div>
        </div>

        <!-- PRAZOS E TEMPO LIMITE -->
        <div>
          <div>
            <label for="dataInicio"> Data de Abertura * </label>
            <input
              pInputText
              id="dataInicio"
              type="date"
              [(ngModel)]="formulario.dataInicio"
              name="dataInicio"
              required
            />
          </div>

          <div>
            <label for="dataFim"> Prazo Limite para Envio * </label>
            <input
              pInputText
              id="dataFim"
              type="date"
              [(ngModel)]="formulario.dataFim"
              name="dataFim"
              required
            />
          </div>

          <div>
            <label for="tempoLimiteMinutos"> Tempo Limite (minutos) * </label>
            <p-inputNumber
              inputId="tempoLimiteMinutos"
              [(ngModel)]="formulario.tempoLimiteMinutos"
              name="tempoLimiteMinutos"
              suffix=" min (IHI GTT: 20)"
              [min]="1"
              [max]="180"
            />
          </div>
        </div>

        <!-- ORIENTAÇÕES PEDAGÓGICAS -->
        <div>
          <label for="orientacoesPedagogicas"> Orientações Pedagógicas para os Alunos </label>
          <textarea
            pTextarea
            id="orientacoesPedagogicas"
            rows="4"
            [(ngModel)]="formulario.orientacoesPedagogicas"
            name="orientacoesPedagogicas"
            placeholder="Instruções aos discentes sobre a realização da auditoria clínica, busca ativa de gatilhos nos registros e preenchimento dos pilares 6M, 5W3H e PDCA..."
          ></textarea>
        </div>

        <!-- STATUS ATIVO -->
        <div>
          <p-toggleswitch inputId="ativa" [(ngModel)]="formulario.ativa" name="ativa" />
          <label for="ativa"> Atividade Ativa (visível para os alunos realizarem) </label>
        </div>

        <!-- BOTÕES -->
        <div>
          <p-button
            label="Cancelar"
            [outlined]="true"
            severity="secondary"
            size="small"
            (onClick)="voltarParaListagem()"
            [disabled]="salvando()"
          />
          <p-button
            [label]="modoEdicao() ? 'Salvar Alterações' : 'Criar Atividade'"
            type="submit"
            size="small"
            [loading]="salvando()"
          />
        </div>
      </form>
    </p-card>
  }
</div>
