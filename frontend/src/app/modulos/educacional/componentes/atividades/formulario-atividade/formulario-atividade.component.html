<div class="page-container flex-col-gap-15">
  <!-- CABEÇALHO DO FORMULÁRIO -->
  <div class="page-header">
    <div>
      <h1 class="page-title">{{ tituloPagina() }}</h1>
      <span class="page-subtitle">{{ subtituloPagina() }}</span>
    </div>
    <p-button
      label="VOLTAR PARA ATIVIDADES"
      [outlined]="true"
      severity="secondary"
      size="small"
      (onClick)="voltarParaListagem()"
    />
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full" />
  }

  @if (carregando()) {
    <div class="center-loading">
      <p-progressSpinner styleClass="w-4rem h-4rem" strokeWidth="4" />
      <span>Carregando dados da atividade...</span>
    </div>
  } @else {
    <p-card header="Configurações da Atividade Prática">
      <form (ngSubmit)="salvar()" class="flex-col-gap-15">
        <!-- TÍTULO DA ATIVIDADE -->
        <div class="flex-col-gap-05">
          <label for="titulo"> Título da Atividade <span class="text-error">*</span> </label>
          <input
            pInputText
            id="titulo"
            type="text"
            [(ngModel)]="formulario.titulo"
            name="titulo"
            placeholder="Ex.: Auditoria de Prontuário 01 - Rastreamento de Gatilhos e Análise 6M"
            class="w-full"
            required
          />
        </div>

        <!-- TURMA E CASO CLÍNICO -->
        <div class="grid-2">
          <div class="flex-col-gap-05">
            <label for="turmaId"> Turma Acadêmica <span class="text-error">*</span> </label>
            <p-select
              inputId="turmaId"
              [options]="turmasOpcoes()"
              optionLabel="label"
              optionValue="value"
              [(ngModel)]="formulario.turmaId"
              name="turmaId"
              placeholder="Selecione a turma..."
              styleClass="w-full"
            />
          </div>

          <div class="flex-col-gap-05">
            <label for="casoClinicoId">
              Caso Clínico Simulado <span class="text-error">*</span>
            </label>
            <p-select
              inputId="casoClinicoId"
              [options]="casosOpcoes()"
              optionLabel="label"
              optionValue="value"
              [(ngModel)]="formulario.casoClinicoId"
              name="casoClinicoId"
              placeholder="Selecione o caso clínico..."
              styleClass="w-full"
            />
          </div>
        </div>

        <!-- PRAZOS E TEMPO LIMITE -->
        <div class="grid-3">
          <div class="flex-col-gap-05">
            <label for="dataInicio"> Data de Abertura <span class="text-error">*</span> </label>
            <input
              pInputText
              id="dataInicio"
              type="date"
              [(ngModel)]="formulario.dataInicio"
              name="dataInicio"
              class="w-full"
              required
            />
          </div>

          <div class="flex-col-gap-05">
            <label for="dataFim"> Prazo Limite para Envio <span class="text-error">*</span> </label>
            <input
              pInputText
              id="dataFim"
              type="date"
              [(ngModel)]="formulario.dataFim"
              name="dataFim"
              class="w-full"
              required
            />
          </div>

          <div class="flex-col-gap-05">
            <label for="tempoLimiteMinutos">
              Tempo Limite (minutos) <span class="text-error">*</span>
            </label>
            <p-inputNumber
              inputId="tempoLimiteMinutos"
              [(ngModel)]="formulario.tempoLimiteMinutos"
              name="tempoLimiteMinutos"
              suffix=" min (IHI GTT: 20)"
              [min]="1"
              [max]="180"
              styleClass="w-full"
            />
          </div>
        </div>

        <!-- ORIENTAÇÕES PEDAGÓGICAS -->
        <div class="flex-col-gap-05">
          <label for="orientacoesPedagogicas"> Orientações Pedagógicas para os Alunos </label>
          <textarea
            pTextarea
            id="orientacoesPedagogicas"
            rows="4"
            [(ngModel)]="formulario.orientacoesPedagogicas"
            name="orientacoesPedagogicas"
            placeholder="Instruções aos discentes sobre a realização da auditoria clínica, busca ativa de gatilhos nos registros e preenchimento dos pilares 6M, 5W3H e PDCA..."
            class="w-full"
          ></textarea>
        </div>

        <!-- STATUS ATIVO -->
        <div class="flex-row-gap-05">
          <p-toggleswitch inputId="ativa" [(ngModel)]="formulario.ativa" name="ativa" />
          <label for="ativa" class="cursor-pointer">
            Atividade Ativa (visível para os alunos realizarem)
          </label>
        </div>

        <!-- BOTÕES -->
        <div class="form-actions">
          <p-button
            label="Cancelar"
            [outlined]="true"
            severity="secondary"
            size="small"
            (onClick)="voltarParaListagem()"
          />
          <p-button
            [label]="modoEdicao() ? 'Salvar Alterações' : 'Criar Atividade'"
            type="submit"
            size="small"
            [loading]="salvando()"
          />
        </div>
      </form>
    </p-card>
  }
</div>
