<div class="space-y-6 max-w-6xl mx-auto">
  <!-- CABEÇALHO DO FORMULÁRIO -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-surface-900">{{ tituloPagina() }}</h1>
      <p class="text-sm text-surface-500 mt-1">{{ subtituloPagina() }}</p>
    </div>
    <div>
      <p-button
        label="Voltar para Lista"
        icon="pi pi-arrow-left"
        [outlined]="true"
        severity="secondary"
        (onClick)="voltarParaListagem()"
      />
    </div>
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full" />
  }

  @if (carregando()) {
    <div class="flex flex-col items-center justify-center py-16 gap-3 text-surface-500">
      <p-progressSpinner strokeWidth="4" class="w-10 h-10" />
      <span class="text-sm">Carregando dados do prontuário simulado...</span>
    </div>
  } @else {
    <form (ngSubmit)="salvar()" class="space-y-6">
      <!-- CARD 1: IDENTIFICAÇÃO DO CASO -->
      <p-card styleClass="shadow-xs border border-surface-200/80 rounded-2xl">
        <ng-template #header>
          <div class="p-6 border-b border-surface-100 flex items-center gap-2">
            <i class="pi pi-id-card text-primary text-base"></i>
            <h2 class="text-base font-bold text-surface-900">
              1. Identificação Geral do Caso Clínico
            </h2>
          </div>
        </ng-template>

        <div class="space-y-4 pt-2">
          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label
                for="titulo"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Título Descritivo do Caso *
              </label>
              <input
                pInputText
                id="titulo"
                type="text"
                [(ngModel)]="formulario.titulo"
                name="titulo"
                required
                placeholder="Ex.: Caso 01 - IAM e Sangramento Digestivo Pós-Trombólise"
                class="w-full"
              />
            </div>

            <div>
              <label
                for="unidadeHospitalarId"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Unidade Hospitalar (HU) *
              </label>
              <p-select
                inputId="unidadeHospitalarId"
                [options]="unidades()"
                optionLabel="nome"
                optionValue="id"
                [(ngModel)]="formulario.unidadeHospitalarId"
                name="unidadeHospitalarId"
                placeholder="Selecione a unidade..."
                styleClass="w-full"
              />
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <div>
              <label
                for="objetivosAprendizagem"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Objetivos Pedagógicos de Aprendizagem
              </label>
              <textarea
                pTextarea
                id="objetivosAprendizagem"
                rows="3"
                [(ngModel)]="formulario.objetivosAprendizagem"
                name="objetivosAprendizagem"
                placeholder="Ex.: Reconhecer gatilhos de medicação e anticoagulação, analisar causa-raiz com 6M..."
                class="w-full"
              ></textarea>
            </div>

            <div>
              <label
                for="descricaoCaso"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Contextualização Clínica
              </label>
              <textarea
                pTextarea
                id="descricaoCaso"
                rows="3"
                [(ngModel)]="formulario.descricaoCaso"
                name="descricaoCaso"
                placeholder="Breve resumo clínico para orientação do docente ou equipe..."
                class="w-full"
              ></textarea>
            </div>
          </div>
        </div>
      </p-card>

      <!-- CARD 2: DADOS DO PACIENTE E PERÍODO -->
      <p-card styleClass="shadow-xs border border-surface-200/80 rounded-2xl">
        <ng-template #header>
          <div class="p-6 border-b border-surface-100 flex items-center gap-2">
            <i class="pi pi-user text-primary text-base"></i>
            <h2 class="text-base font-bold text-surface-900">
              2. Dados do Paciente e Período de Internação
            </h2>
          </div>
        </ng-template>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4 pt-2">
          <div class="lg:col-span-2">
            <label
              for="numeroAtendimento"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Nº Prontuário / Atendimento *
            </label>
            <input
              pInputText
              id="numeroAtendimento"
              type="text"
              [(ngModel)]="formulario.numeroAtendimento"
              name="numeroAtendimento"
              placeholder="Ex.: PRONT-2026-001"
              required
              class="w-full font-mono font-bold"
            />
          </div>

          <div>
            <label
              for="idadePaciente"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Idade (anos) *
            </label>
            <p-inputNumber
              inputId="idadePaciente"
              [(ngModel)]="formulario.idadePaciente"
              name="idadePaciente"
              [min]="0"
              [max]="130"
              styleClass="w-full"
            />
          </div>

          <div>
            <label
              for="dataAdmissao"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Data Admissão *
            </label>
            <input
              pInputText
              id="dataAdmissao"
              type="date"
              [(ngModel)]="formulario.dataAdmissao"
              (change)="calcularDias()"
              name="dataAdmissao"
              required
              class="w-full"
            />
          </div>

          <div>
            <label
              for="dataAlta"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Data Alta / Desfecho *
            </label>
            <input
              pInputText
              id="dataAlta"
              type="date"
              [(ngModel)]="formulario.dataAlta"
              (change)="calcularDias()"
              name="dataAlta"
              required
              class="w-full"
            />
          </div>
        </div>
      </p-card>

      <!-- CARD 3: SESSÕES DO PRONTUÁRIO SIMULADO -->
      <p-card styleClass="shadow-xs border border-surface-200/80 rounded-2xl">
        <ng-template #header>
          <div class="p-6 border-b border-surface-100 flex items-center gap-2">
            <i class="pi pi-file-edit text-primary text-base"></i>
            <h2 class="text-base font-bold text-surface-900">
              3. Registros Clínicos Simulados do Prontuário
            </h2>
          </div>
        </ng-template>

        <div class="space-y-6 pt-2">
          <div>
            <label
              for="sumarioAlta"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Sumário de Alta, Anamnese e Hipóteses Diagnósticas *
            </label>
            <textarea
              pTextarea
              id="sumarioAlta"
              rows="4"
              [(ngModel)]="formulario.sumarioAlta"
              name="sumarioAlta"
              placeholder="Histórico da admissão, queixa principal, hipóteses diagnósticas e evolução para alta..."
              required
              class="w-full font-mono text-xs leading-relaxed"
            ></textarea>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div>
              <label
                for="prescricoesMedicas"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Prescrições Médicas e Farmacoterapia
              </label>
              <textarea
                pTextarea
                id="prescricoesMedicas"
                rows="6"
                [(ngModel)]="formulario.prescricoesMedicas"
                name="prescricoesMedicas"
                placeholder="Medicamentos prescritos, dosagens, horários, diluições, suspensões..."
                class="w-full font-mono text-xs leading-relaxed"
              ></textarea>
            </div>

            <div>
              <label
                for="examesLaboratoriais"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Resultados de Exames Laboratoriais e Imagem
              </label>
              <textarea
                pTextarea
                id="examesLaboratoriais"
                rows="6"
                [(ngModel)]="formulario.examesLaboratoriais"
                name="examesLaboratoriais"
                placeholder="Hemograma, coagulograma, gasometria, creatinina, glicemia, raio-X..."
                class="w-full font-mono text-xs leading-relaxed"
              ></textarea>
            </div>
          </div>

          <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
            <div>
              <label
                for="evolucoesMultiprofissionais"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Evoluções Multiprofissionais (Enfermagem, Farmácia, Médica, etc.)
              </label>
              <textarea
                pTextarea
                id="evolucoesMultiprofissionais"
                rows="6"
                [(ngModel)]="formulario.evolucoesMultiprofissionais"
                name="evolucoesMultiprofissionais"
                placeholder="Notas de enfermagem, sinais vitais, intercorrências, checagem de beira de leito..."
                class="w-full font-mono text-xs leading-relaxed"
              ></textarea>
            </div>

            <div>
              <label
                for="relatorioCirurgico"
                class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
              >
                Relatório Cirúrgico e Anestésico (Opcional)
              </label>
              <textarea
                pTextarea
                id="relatorioCirurgico"
                rows="6"
                [(ngModel)]="formulario.relatorioCirurgico"
                name="relatorioCirurgico"
                placeholder="Descrição do procedimento cirúrgico, técnica anestésica, contagem de compressas, sangramento..."
                class="w-full font-mono text-xs leading-relaxed"
              ></textarea>
            </div>
          </div>
        </div>
      </p-card>

      <!-- BOTÕES DE SUBMISSÃO -->
      <div class="pt-4 border-t border-surface-200 flex items-center justify-end gap-3">
        <p-button
          label="Cancelar"
          [outlined]="true"
          severity="secondary"
          (onClick)="voltarParaListagem()"
          [disabled]="salvando()"
        />
        <p-button
          [label]="modoEdicao() ? 'Salvar Alterações' : 'Cadastrar Caso Clínico'"
          type="submit"
          icon="pi pi-check"
          [loading]="salvando()"
          styleClass="shadow-sm"
        />
      </div>
    </form>
  }
</div>
