<div>
  <!-- CABEÇALHO DO FORMULÁRIO -->
  <div>
    <div>
      <h1>{{ tituloPagina() }}</h1>
      <span>{{ subtituloPagina() }}</span>
    </div>
    <p-button
      label="VOLTAR PARA CASOS"
      [outlined]="true"
      severity="secondary"
      size="small"
      (onClick)="voltarParaListagem()"
    />
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" />
  }

  @if (carregando()) {
    <div>
      <p-progressSpinner strokeWidth="4" />
      <span>Carregando dados do caso clínico...</span>
    </div>
  } @else {
    <form (ngSubmit)="salvar()">
      <!-- CARD 1: IDENTIFICAÇÃO DO CASO -->
      <p-card header="1. Identificação Geral do Caso Clínico">
        <div>
          <div>
            <div>
              <label for="titulo"> Título Descritivo do Caso * </label>
              <input
                pInputText
                id="titulo"
                type="text"
                [(ngModel)]="formulario.titulo"
                name="titulo"
                required
                placeholder="Ex.: Caso 01 - IAM e Sangramento Digestivo Pós-Trombólise"
              />
            </div>

            <div>
              <label for="unidadeHospitalarId"> Unidade Hospitalar (HU) * </label>
              <p-select
                inputId="unidadeHospitalarId"
                [options]="unidades()"
                optionLabel="nome"
                optionValue="id"
                [(ngModel)]="formulario.unidadeHospitalarId"
                name="unidadeHospitalarId"
                placeholder="Selecione a unidade..."
              />
            </div>
          </div>

          <div>
            <div>
              <label for="objetivosAprendizagem"> Objetivos Pedagógicos de Aprendizagem </label>
              <textarea
                pTextarea
                id="objetivosAprendizagem"
                rows="3"
                [(ngModel)]="formulario.objetivosAprendizagem"
                name="objetivosAprendizagem"
                placeholder="Ex.: Reconhecer gatilhos de medicação e anticoagulação, analisar causa-raiz com 6M..."
              ></textarea>
            </div>

            <div>
              <label for="descricaoCaso"> Contextualização Clínica </label>
              <textarea
                pTextarea
                id="descricaoCaso"
                rows="3"
                [(ngModel)]="formulario.descricaoCaso"
                name="descricaoCaso"
                placeholder="Breve resumo clínico para orientação do docente ou equipe..."
              ></textarea>
            </div>
          </div>
        </div>
      </p-card>

      <!-- CARD 2: DADOS DO PACIENTE E PERÍODO -->
      <p-card header="2. Dados do Paciente e Período de Internação">
        <div>
          <div>
            <label for="numeroAtendimento"> Nº Prontuário / Atendimento * </label>
            <input
              pInputText
              id="numeroAtendimento"
              type="text"
              [(ngModel)]="formulario.numeroAtendimento"
              name="numeroAtendimento"
              placeholder="Ex.: PRONT-2026-001"
              required
            />
          </div>

          <div>
            <label for="idadePaciente"> Idade (anos) * </label>
            <p-inputNumber
              inputId="idadePaciente"
              [(ngModel)]="formulario.idadePaciente"
              name="idadePaciente"
              [min]="0"
              [max]="130"
            />
          </div>

          <div>
            <label for="dataAdmissao"> Data Admissão * </label>
            <input
              pInputText
              id="dataAdmissao"
              type="date"
              [(ngModel)]="formulario.dataAdmissao"
              (change)="calcularDias()"
              name="dataAdmissao"
              required
            />
          </div>

          <div>
            <label for="dataAlta"> Data Alta / Desfecho * </label>
            <input
              pInputText
              id="dataAlta"
              type="date"
              [(ngModel)]="formulario.dataAlta"
              (change)="calcularDias()"
              name="dataAlta"
              required
            />
          </div>

          <div>
            <label for="tempoPermanenciaDias"> Permanência (dias) </label>
            <p-inputNumber
              inputId="tempoPermanenciaDias"
              [(ngModel)]="formulario.tempoPermanenciaDias"
              name="tempoPermanenciaDias"
              [min]="0"
            />
          </div>
        </div>
      </p-card>

      <!-- CARD 3: SESSÕES DO PRONTUÁRIO SIMULADO -->
      <p-card header="3. Registros Clínicos Simulados do Prontuário">
        <div>
          <div>
            <label for="sumarioAlta"> Sumário de Alta, Anamnese e Hipóteses Diagnósticas * </label>
            <textarea
              pTextarea
              id="sumarioAlta"
              rows="4"
              [(ngModel)]="formulario.sumarioAlta"
              name="sumarioAlta"
              placeholder="Histórico da admissão, queixa principal, hipóteses diagnósticas e evolução para alta..."
              required
            ></textarea>
          </div>

          <div>
            <div>
              <label for="prescricoesMedicas"> Prescrições Médicas e Farmacoterapia </label>
              <textarea
                pTextarea
                id="prescricoesMedicas"
                rows="5"
                [(ngModel)]="formulario.prescricoesMedicas"
                name="prescricoesMedicas"
                placeholder="Medicamentos prescritos, dosagens, horários, diluições, suspensões..."
              ></textarea>
            </div>

            <div>
              <label for="examesLaboratoriais"> Resultados de Exames Laboratoriais e Imagem </label>
              <textarea
                pTextarea
                id="examesLaboratoriais"
                rows="5"
                [(ngModel)]="formulario.examesLaboratoriais"
                name="examesLaboratoriais"
                placeholder="Hemograma, coagulograma, gasometria, creatinina, glicemia, raio-X..."
              ></textarea>
            </div>
          </div>

          <div>
            <div>
              <label for="evolucoesMultiprofissionais">
                Evoluções Multiprofissionais (Enfermagem, Farmácia, Médica, etc.)
              </label>
              <textarea
                pTextarea
                id="evolucoesMultiprofissionais"
                rows="5"
                [(ngModel)]="formulario.evolucoesMultiprofissionais"
                name="evolucoesMultiprofissionais"
                placeholder="Notas de enfermagem, sinais vitais, intercorrências, checagem de beira de leito..."
              ></textarea>
            </div>

            <div>
              <label for="relatorioCirurgico"> Relatório Cirúrgico e Anestésico (Opcional) </label>
              <textarea
                pTextarea
                id="relatorioCirurgico"
                rows="5"
                [(ngModel)]="formulario.relatorioCirurgico"
                name="relatorioCirurgico"
                placeholder="Descrição do procedimento cirúrgico, técnica anestésica, contagem de compressas, sangramento..."
              ></textarea>
            </div>
          </div>
        </div>
      </p-card>

      <!-- BOTÕES DE SUBMISSÃO -->
      <div>
        <p-button
          label="Cancelar"
          [outlined]="true"
          severity="secondary"
          size="small"
          (onClick)="voltarParaListagem()"
          [disabled]="salvando()"
        />
        <p-button
          [label]="modoEdicao() ? 'Salvar Alterações' : 'Cadastrar Caso Clínico'"
          type="submit"
          size="small"
          [loading]="salvando()"
        />
      </div>
    </form>
  }
</div>
