<div>
  <!-- CABEÇALHO -->
  <div class="page-header">
    <div>
      <h1 class="page-title">Controle de Usuários</h1>
      <span class="page-subtitle"
        >Total cadastrado: {{ totalUsuarios() }} usuários no SIGEA-GTT</span
      >
    </div>
    <button pButton type="button" label="NOVO USUÁRIO" (click)="navegarParaNovo()"></button>
  </div>

  <!-- BARRA DE FILTROS -->
  <div class="filter-card">
    <input
      pInputText
      type="text"
      [ngModel]="termoBusca()"
      (ngModelChange)="termoBusca.set($event)"
      placeholder="Filtrar por nome, e-mail institucional ou matrícula..."
      class="search-input"
    />
    <p-select
      [options]="opcoesPerfil"
      [ngModel]="filtroPerfil()"
      (ngModelChange)="filtroPerfil.set($event)"
      optionLabel="label"
      optionValue="value"
      class="filter-select"
    />
    <p-select
      [options]="opcoesStatus"
      [ngModel]="filtroStatus()"
      (ngModelChange)="filtroStatus.set($event)"
      optionLabel="label"
      optionValue="value"
      class="filter-select"
    />
  </div>

  <!-- TABELA PRIMENG COMPACTA -->
  <p-table
    [value]="usuariosLinhasFiltradas()"
    styleClass="p-datatable-sm p-datatable-striped w-full"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 25, 50]"
    [loading]="carregando()"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="nome" class="w-25p">Nome <p-sortIcon field="nome" /></th>
        <th pSortableColumn="matricula" class="w-15p">
          Matrícula <p-sortIcon field="matricula" />
        </th>
        <th pSortableColumn="email" class="w-25p">
          E-mail Institucional <p-sortIcon field="email" />
        </th>
        <th pSortableColumn="perfil" class="w-12p">Perfil <p-sortIcon field="perfil" /></th>
        <th class="w-10p">Status</th>
        <th class="w-13p text-right">Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-u>
      <tr>
        <td>
          <span class="font-bold">{{ u.nome }}</span>
          @if (u.ehVoce) {
            <p-tag value="Você" severity="info" styleClass="ml-2" />
          }
        </td>
        <td>
          <code>{{ u.matricula }}</code>
        </td>
        <td>{{ u.email }}</td>
        <td>
          <p-tag [value]="u.perfil" [severity]="getPerfilSeverity(u.perfil)" />
        </td>
        <td>
          <p-tag
            [value]="u.ativo ? 'ATIVO' : 'INATIVO'"
            [severity]="u.ativo ? 'success' : 'danger'"
          />
        </td>
        <td>
          <div class="actions-cell">
            <button
              pButton
              type="button"
              icon="pi pi-pencil"
              [text]="true"
              severity="secondary"
              size="small"
              (click)="navegarParaEditar(u.original)"
              pTooltip="Editar Usuário"
              tooltipPosition="top"
              aria-label="Editar Usuário"
            ></button>
            <button
              pButton
              type="button"
              icon="pi pi-key"
              [text]="true"
              severity="warn"
              size="small"
              (click)="solicitarResetSenha(u.original)"
              pTooltip="Resetar Senha para Sigea@123"
              tooltipPosition="top"
              aria-label="Resetar Senha"
            ></button>
            <button
              pButton
              type="button"
              [icon]="u.ativo ? 'pi pi-ban' : 'pi pi-check'"
              [text]="true"
              [severity]="u.ativo ? 'danger' : 'success'"
              size="small"
              (click)="alternarAtivacao(u.original)"
              [pTooltip]="u.ativo ? 'Inativar Usuário' : 'Reativar Usuário'"
              tooltipPosition="top"
              [attr.aria-label]="u.ativo ? 'Inativar Usuário' : 'Reativar Usuário'"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="6" class="text-center p-3 font-normal">
          Nenhum usuário encontrado com os filtros informados.
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
