<div>
  <!-- CABEÇALHO -->
  <div>
    <div>
      <h1>{{ tituloPagina() }}</h1>
      <span>{{ subtituloPagina() }}</span>
    </div>
    <button
      pButton
      type="button"
      label="VOLTAR PARA TURMAS"
      [outlined]="true"
      severity="secondary"
      (click)="voltarParaListagem()"
    ></button>
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" />
  }

  <p-card>
    <form (ngSubmit)="salvar()">
      <div>
        <!-- CÓDIGO DA DISCIPLINA -->
        <div>
          <label for="codigoDisciplina">Código da Disciplina *</label>
          <input
            pInputText
            id="codigoDisciplina"
            type="text"
            [(ngModel)]="formulario.codigoDisciplina"
            name="codigoDisciplina"
            required
            maxlength="30"
            placeholder="Ex.: MED0023, ENF0010"
          />
          <span>Código alfanumérico cadastrado no SIGAA.</span>
        </div>

        <!-- PERÍODO LETIVO -->
        <div>
          <label for="periodoLetivo">Período Letivo *</label>
          <input
            pInputText
            id="periodoLetivo"
            type="text"
            [(ngModel)]="formulario.periodoLetivo"
            name="periodoLetivo"
            required
            maxlength="10"
            placeholder="Ex.: 2026.1"
          />
          <span>Formato: AAAA.S (Ano e Semestre).</span>
        </div>

        <!-- DOCENTE RESPONSÁVEL -->
        <div>
          <label for="professorResponsavelId">Docente Responsável *</label>
          <p-select
            id="professorResponsavelId"
            [options]="professores()"
            [(ngModel)]="formulario.professorResponsavelId"
            name="professorResponsavelId"
            optionLabel="label"
            optionValue="value"
            placeholder="Selecione o docente orientador da disciplina"
            styleClass="w-full"
          /><span>Docente que terá acesso às atividades e avaliações desta turma.</span>
        </div>
      </div>

      <!-- BOTÕES DE AÇÃO -->
      <div>
        <button
          pButton
          type="button"
          label="Cancelar"
          severity="secondary"
          [text]="true"
          (click)="voltarParaListagem()"
        ></button>
        <button pButton type="submit" label="Salvar Turma" [loading]="salvando()"></button>
      </div>
    </form>
  </p-card>
</div>
