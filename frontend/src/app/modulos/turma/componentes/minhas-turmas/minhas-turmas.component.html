<div class="space-y-6">
  <!-- CABEÇALHO -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <div class="flex items-center gap-3">
        <h1 class="text-2xl font-bold tracking-tight text-surface-900 dark:text-surface-0">Minhas Turmas Vinculadas</h1>
        <p-badge [value]="totalTurmas()" severity="secondary" />
      </div>
      <p class="text-sm text-surface-500 dark:text-surface-400 mt-1">
        Disciplinas hospitalares sob sua orientação docente no SIGEA-GTT
      </p>
    </div>
  </div>

  <!-- BARRA DE BUSCA -->
  <div class="bg-surface-0 dark:bg-surface-900 border border-surface-200/80 dark:border-surface-800 rounded-2xl p-4 shadow-xs">
    <p-iconfield class="w-full">
      <p-inputicon class="pi pi-search text-surface-400" />
      <input
        pInputText
        type="text"
        [ngModel]="termoBusca()"
        (ngModelChange)="termoBusca.set($event)"
        placeholder="Filtrar por código da disciplina ou período letivo (ex: 2024.1)..."
        class="w-full"
      />
    </p-iconfield>
  </div>

  <!-- TABELA DE TURMAS DO DOCENTE -->
  <div class="bg-surface-0 dark:bg-surface-900 border border-surface-200/80 dark:border-surface-800 rounded-2xl overflow-hidden shadow-xs">
    <p-table
      [value]="turmasFiltradas()"
      [paginator]="true"
      [rows]="15"
      [rowsPerPageOptions]="[15, 25, 50]"
      [loading]="carregando()"
      [stripedRows]="true"
      [showCurrentPageReport]="true"
      currentPageReportTemplate="Exibindo {first} a {last} de {totalRecords} turmas"
      [rowHover]="true"
      styleClass="p-datatable-sm"
    >
      <ng-template #header>
        <tr class="text-xs uppercase text-surface-500 dark:text-surface-400 font-semibold tracking-wider">
          <th pSortableColumn="codigoDisciplina" class="py-3.5 px-4">
            <div class="flex items-center gap-1.5">
              Disciplina / Código <p-sortIcon field="codigoDisciplina" />
            </div>
          </th>
          <th pSortableColumn="periodoLetivo" class="py-3.5 px-4 w-32">
            <div class="flex items-center gap-1.5">
              Período Letivo <p-sortIcon field="periodoLetivo" />
            </div>
          </th>
          <th pSortableColumn="totalAlunos" class="py-3.5 px-4 text-center w-36">
            <div class="flex items-center justify-center gap-1.5">
              Discentes <p-sortIcon field="totalAlunos" />
            </div>
          </th>
          <th class="py-3.5 px-4">Status</th>
          <th class="py-3.5 px-4 text-right">Ações</th>
        </tr>
      </ng-template>

      <ng-template #body let-t>
        <tr class="hover:bg-surface-50/80 dark:hover:bg-surface-800/50 transition-colors">
          <td class="py-3 px-4 font-semibold text-surface-900 dark:text-surface-100 text-sm">
            {{ t.codigoDisciplina }}
          </td>
          <td class="py-3 px-4">
            <code
              class="px-2 py-1 rounded bg-surface-100 dark:bg-surface-800 font-mono text-xs font-bold text-surface-700 dark:text-surface-300"
            >
              {{ t.periodoLetivo }}
            </code>
          </td>
          <td class="py-3 px-4 text-center">
            <p-badge [value]="t.totalAlunos + ' aluno(s)'" severity="info" />
          </td>
          <td class="py-3 px-4">
            <p-tag
              [value]="t.ativa ? 'ATIVA' : 'INATIVA'"
              [severity]="t.ativa ? 'success' : 'warn'"
              styleClass="text-[11px]"
            />
          </td>
          <td class="py-3 px-4 text-right">
            <p-button
              icon="pi pi-users"
              label="Ver Discentes"
              [text]="true"
              severity="info"
              size="small"
              pTooltip="Acessar lista de alunos inscritos"
              tooltipPosition="top"
              (onClick)="navegarParaAlunos(t.original)"
            />
          </td>
        </tr>
      </ng-template>

      <ng-template #emptymessage>
        <tr>
          <td colspan="5" class="text-center py-8 text-surface-500 dark:text-surface-400 text-sm">
            <i class="pi pi-search text-2xl mb-2 text-surface-300 dark:text-surface-600 block"></i>
            Nenhuma turma vinculada localizada.
          </td>
        </tr>
      </ng-template>
    </p-table>
  </div>
</div>
