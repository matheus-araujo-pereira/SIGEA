<div>
  <!-- CABEÇALHO -->
  <div>
    <h1>Minhas Turmas Vinculadas</h1>
    <span>Acesso rápido às turmas sob sua docência no SIGEA-GTT</span>
  </div>

  <!-- BARRA DE BUSCA -->
  <div>
    <input
      pInputText
      type="text"
      [ngModel]="termoBusca()"
      (ngModelChange)="termoBusca.set($event)"
      placeholder="Filtrar por código de disciplina ou período letivo..."
    />
  </div>

  <!-- TABELA PRIMENG -->
  <p-table
    [value]="turmasFiltradas()"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 25, 50]"
    [loading]="carregando()"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="codigoDisciplina">
          Código da Disciplina <p-sortIcon field="codigoDisciplina" />
        </th>
        <th pSortableColumn="periodoLetivo">Período Letivo <p-sortIcon field="periodoLetivo" /></th>
        <th pSortableColumn="totalAlunos">Discentes <p-sortIcon field="totalAlunos" /></th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-t>
      <tr>
        <td>
          <span>{{ t.codigoDisciplina }}</span>
        </td>
        <td>
          <code>{{ t.periodoLetivo }}</code>
        </td>
        <td>
          <span>{{ t.totalAlunos }} aluno(s)</span>
        </td>
        <td>
          <span>{{ t.ativa ? 'ATIVA' : 'INATIVA' }}</span>
        </td>
        <td>
          <div>
            <button
              pButton
              type="button"
              label="ALUNOS"
              [text]="true"
              severity="secondary"
              size="small"
              (click)="verAlunos(t.id)"
              pTooltip="Ver Alunos Matriculados"
              tooltipPosition="top"
            ></button>
            <button
              pButton
              type="button"
              label="ATIVIDADES"
              [text]="true"
              severity="info"
              size="small"
              (click)="verAtividades(t.id)"
              pTooltip="Ver Atividades da Turma"
              tooltipPosition="top"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="5">Nenhuma turma vinculada a seu cadastro docente.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
