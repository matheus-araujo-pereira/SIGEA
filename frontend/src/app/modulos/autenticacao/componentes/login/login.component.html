<div>
  <p-card>
    <ng-template #header>
      <div>
        <h1>SIGEA-GTT</h1>
        <p>Sistema Inteligente de Gestão de Eventos Adversos – Global Trigger Tool</p>
        <span>Hospital Universitário HU-UFS</span>
      </div>
    </ng-template>

    @if (mensagemErro()) {
      <p-message severity="error" [text]="mensagemErro()!" />
    }

    <form (ngSubmit)="entrar()">
      <div>
        <label for="identificador">E-mail Institucional (&#64;academico.ufs.br)</label>
        <input
          pInputText
          id="identificador"
          type="email"
          [(ngModel)]="identificador"
          name="identificador"
          autocomplete="username"
          placeholder="usuario@academico.ufs.br"
          required
        />
      </div>

      <div>
        <label for="senha">Senha</label>
        <p-password
          id="senha"
          [(ngModel)]="senha"
          name="senha"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          required
        />
      </div>

      <p-button type="submit" [label]="textoBotao()" [loading]="carregando()" />
    </form>
  </p-card>
</div>
