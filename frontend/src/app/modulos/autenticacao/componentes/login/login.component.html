<div
  class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-surface-100 via-surface-50 to-teal-50/40"
>
  <div class="w-full max-w-md">
    <p-card styleClass="shadow-2xl border border-surface-200/80 rounded-2xl overflow-hidden">
      <ng-template #header>
        <div class="pt-8 pb-4 px-6 text-center bg-surface-0 border-b border-surface-100">
          <div
            class="w-14 h-14 rounded-2xl bg-primary/10 border border-primary/20 text-primary flex items-center justify-center mx-auto mb-4 shadow-xs"
          >
            <i class="pi pi-shield text-2xl"></i>
          </div>
          <h1 class="text-2xl font-bold text-surface-900 tracking-tight">SIGEA-GTT</h1>
          <p class="text-xs font-semibold uppercase tracking-wider text-primary mt-1">
            Hospital Universitário HU-UFS • EBSERH
          </p>
          <p class="text-xs text-surface-500 mt-1 max-w-xs mx-auto">
            Gestão de Eventos Adversos com metodologia Global Trigger Tool (IHI)
          </p>
        </div>
      </ng-template>

      <div class="space-y-5 pt-4">
        @if (mensagemErro()) {
          <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full text-xs" />
        }

        <form (ngSubmit)="entrar()" class="space-y-4">
          <div>
            <label
              for="identificador"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              E-mail Institucional (&#64;academico.ufs.br)
            </label>
            <p-iconfield class="w-full">
              <p-inputicon class="pi pi-envelope text-surface-400" />
              <input
                pInputText
                id="identificador"
                type="email"
                [(ngModel)]="identificador"
                name="identificador"
                autocomplete="username"
                placeholder="usuario@academico.ufs.br"
                required
                class="w-full"
              />
            </p-iconfield>
          </div>

          <div>
            <label
              for="senha"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Senha de Acesso
            </label>
            <p-iconfield class="w-full">
              <p-inputicon class="pi pi-lock text-surface-400" />
              <p-password
                id="senha"
                [(ngModel)]="senha"
                name="senha"
                [feedback]="false"
                [toggleMask]="true"
                autocomplete="current-password"
                placeholder="••••••••"
                required
                styleClass="w-full"
                [inputStyle]="{ width: '100%', paddingLeft: '2.5rem' }"
              />
            </p-iconfield>
          </div>

          <div class="pt-2">
            <p-button
              type="submit"
              [label]="textoBotao()"
              icon="pi pi-sign-in"
              [loading]="carregando()"
              styleClass="w-full shadow-sm py-3 font-semibold"
            />
          </div>
        </form>

        <div class="pt-4 border-t border-surface-100 text-center">
          <p class="text-[11px] text-surface-500">
            Ambiente de auditoria clínica e ensino hospitalar da Universidade Federal de Sergipe. Em
            caso de dúvidas, contate o administrador do sistema.
          </p>
        </div>
      </div>
    </p-card>
  </div>
</div>
