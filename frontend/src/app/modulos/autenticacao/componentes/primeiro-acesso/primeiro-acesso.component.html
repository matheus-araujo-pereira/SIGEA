<div
  class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-surface-100 via-surface-50 to-teal-50/40"
>
  <div class="w-full max-w-md">
    <p-card styleClass="shadow-2xl border border-surface-200/80 rounded-2xl overflow-hidden">
      <ng-template #header>
        <div class="pt-8 pb-4 px-6 text-center bg-surface-0 border-b border-surface-100">
          <div
            class="w-14 h-14 rounded-2xl bg-amber-500/10 border border-amber-500/20 text-amber-600 flex items-center justify-center mx-auto mb-4 shadow-xs"
          >
            <i class="pi pi-key text-2xl"></i>
          </div>
          <h1 class="text-xl font-bold text-surface-900 tracking-tight">Primeiro Acesso</h1>
          <p class="text-xs text-surface-500 mt-1">
            Defina sua senha definitiva para continuar no SIGEA-GTT:
            <span class="block font-semibold text-surface-800 mt-0.5">{{ nomeUsuario() }}</span>
          </p>
        </div>
      </ng-template>

      <div class="space-y-5 pt-4">
        @if (mensagemErro()) {
          <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full text-xs" />
        }

        <form (ngSubmit)="confirmarRedefinicao()" class="space-y-4">
          <div>
            <label
              for="senhaAtual"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Senha Temporária Atual *
            </label>
            <p-password
              id="senhaAtual"
              [(ngModel)]="senhaAtual"
              name="senhaAtual"
              [feedback]="false"
              [toggleMask]="true"
              autocomplete="current-password"
              placeholder="Sua senha temporária"
              required
              styleClass="w-full"
              [inputStyle]="{ width: '100%' }"
            />
          </div>

          <div>
            <label
              for="novaSenha"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Nova Senha (mínimo 6 caracteres) *
            </label>
            <p-password
              id="novaSenha"
              [(ngModel)]="novaSenha"
              name="novaSenha"
              [feedback]="true"
              [toggleMask]="true"
              autocomplete="new-password"
              placeholder="Crie sua nova senha segura"
              required
              styleClass="w-full"
              [inputStyle]="{ width: '100%' }"
            />
          </div>

          <div>
            <label
              for="confirmacao"
              class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
            >
              Confirme a Nova Senha *
            </label>
            <p-password
              id="confirmacao"
              [(ngModel)]="confirmacao"
              name="confirmacao"
              [feedback]="false"
              [toggleMask]="true"
              autocomplete="new-password"
              placeholder="Repita a nova senha"
              required
              styleClass="w-full"
              [inputStyle]="{ width: '100%' }"
            />
          </div>

          <div class="pt-2">
            <p-button
              type="submit"
              [label]="textoBotao()"
              icon="pi pi-check"
              [loading]="carregando()"
              styleClass="w-full shadow-sm py-3 font-semibold"
            />
          </div>
        </form>
      </div>
    </p-card>
  </div>
</div>
