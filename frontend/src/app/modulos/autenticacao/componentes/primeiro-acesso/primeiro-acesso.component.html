<div>
  <p-card>
    <ng-template #header>
      <div>
        <h1>PRIMEIRO ACESSO</h1>
        <p>
          Defina sua nova senha pessoal: <strong>{{ nomeUsuario() }}</strong>
        </p>
      </div>
    </ng-template>

    @if (mensagemErro()) {
      <p-message severity="error" [text]="mensagemErro()!" />
    }

    <form (ngSubmit)="confirmarRedefinicao()">
      <div>
        <label for="senhaAtual">Senha Atual (Temporária)</label>
        <p-password
          id="senhaAtual"
          [(ngModel)]="senhaAtual"
          name="senhaAtual"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="current-password"
          required
        />
      </div>

      <div>
        <label for="novaSenha">Nova Senha (mínimo 6 caracteres)</label>
        <p-password
          id="novaSenha"
          [(ngModel)]="novaSenha"
          name="novaSenha"
          [feedback]="true"
          [toggleMask]="true"
          autocomplete="new-password"
          required
        />
      </div>

      <div>
        <label for="confirmacao">Confirmar Nova Senha</label>
        <p-password
          id="confirmacao"
          [(ngModel)]="confirmacao"
          name="confirmacao"
          [feedback]="false"
          [toggleMask]="true"
          autocomplete="new-password"
          required
        />
      </div>

      <p-button type="submit" [label]="textoBotao()" [loading]="carregando()" />
    </form>
  </p-card>
</div>
