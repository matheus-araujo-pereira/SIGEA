<div>
  <!-- CABEÇALHO -->
  <div>
    <div>
      <h1>Unidades Hospitalares HU-UFS</h1>
      <span>Total cadastrado: {{ totalUnidades() }} unidades vinculadas ao sistema</span>
    </div>
    <button pButton type="button" label="NOVA UNIDADE" (click)="navegarParaNovo()"></button>
  </div>

  <!-- BARRA DE FILTROS -->
  <div>
    <input
      pInputText
      type="text"
      [ngModel]="termoBusca()"
      (ngModelChange)="termoBusca.set($event)"
      placeholder="Filtrar por nome ou sigla da unidade..."
    />
    <p-select
      [options]="opcoesStatus"
      [ngModel]="filtroStatus()"
      (ngModelChange)="filtroStatus.set($event)"
      optionLabel="label"
      optionValue="value"
    />
  </div>

  <!-- TABELA PRIMENG -->
  <p-table
    [value]="unidadesLinhasFiltradas()"
    [paginator]="true"
    [rows]="15"
    [rowsPerPageOptions]="[15, 25, 50]"
    [loading]="carregando()"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="sigla">Sigla <p-sortIcon field="sigla" /></th>
        <th pSortableColumn="nome">Nome da Unidade Hospitalar <p-sortIcon field="nome" /></th>
        <th>Status</th>
        <th>Ações</th>
      </tr>
    </ng-template>
    <ng-template #body let-u>
      <tr>
        <td>
          <span>{{ u.sigla }}</span>
        </td>
        <td>{{ u.nome }}</td>
        <td>
          <span>{{ u.ativa ? 'ATIVA' : 'INATIVA' }}</span>
        </td>
        <td>
          <div>
            <button
              pButton
              type="button"
              label="EDITAR"
              [text]="true"
              severity="secondary"
              size="small"
              (click)="navegarParaEditar(u.original)"
              pTooltip="Editar Unidade"
              tooltipPosition="top"
            ></button>
            <button
              pButton
              type="button"
              [label]="u.ativa ? 'INATIVAR' : 'ATIVAR'"
              [text]="true"
              [severity]="u.ativa ? 'warn' : 'success'"
              size="small"
              (click)="alternarStatus(u.original)"
              [pTooltip]="u.ativa ? 'Inativar Unidade' : 'Reativar Unidade'"
              tooltipPosition="top"
            ></button>
            <button
              pButton
              type="button"
              label="EXCLUIR"
              [text]="true"
              severity="danger"
              size="small"
              (click)="excluir(u.original)"
              pTooltip="Excluir Unidade"
              tooltipPosition="top"
            ></button>
          </div>
        </td>
      </tr>
    </ng-template>
    <ng-template #emptymessage>
      <tr>
        <td colspan="4">Nenhuma unidade hospitalar encontrada.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
