<div class="space-y-6 max-w-4xl mx-auto">
  <!-- CABEÇALHO -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h1 class="text-2xl font-bold tracking-tight text-surface-900">{{ tituloPagina() }}</h1>
      <p class="text-sm text-surface-500 mt-1">{{ subtituloPagina() }}</p>
    </div>
    <div>
      <p-button
        label="Voltar para Lista"
        icon="pi pi-arrow-left"
        [outlined]="true"
        severity="secondary"
        (onClick)="voltarParaListagem()"
      />
    </div>
  </div>

  @if (mensagemErro()) {
    <p-message severity="error" [text]="mensagemErro()!" styleClass="w-full" />
  }

  <p-card styleClass="shadow-xs border border-surface-200/80 rounded-2xl">
    <form (ngSubmit)="salvar()" class="space-y-6">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <!-- SIGLA -->
        <div>
          <label
            for="sigla"
            class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
          >
            Sigla da Unidade *
          </label>
          <input
            pInputText
            id="sigla"
            type="text"
            [(ngModel)]="formulario.sigla"
            name="sigla"
            required
            maxlength="20"
            placeholder="Ex.: UTI-GERAL, ENF-CIR, PS"
            class="w-full font-mono font-bold"
          />
          <span class="block text-xs text-surface-400 mt-1"
            >Abreviação oficial adotada pelo HU-UFS / EBSERH.</span
          >
        </div>

        <!-- NOME DA UNIDADE -->
        <div>
          <label
            for="nome"
            class="block text-xs font-semibold text-surface-700 uppercase tracking-wider mb-1.5"
          >
            Nome da Unidade Assistencial *
          </label>
          <input
            pInputText
            id="nome"
            type="text"
            [(ngModel)]="formulario.nome"
            name="nome"
            required
            maxlength="100"
            placeholder="Ex.: Unidade de Terapia Intensiva Adulto"
            class="w-full"
          />
          <span class="block text-xs text-surface-400 mt-1"
            >Nome completo do setor ou enfermaria assistencial.</span
          >
        </div>
      </div>

      <!-- BOTÕES DE AÇÃO -->
      <div class="pt-4 border-t border-surface-100 flex items-center justify-end gap-3">
        <p-button
          type="button"
          label="Cancelar"
          severity="secondary"
          [text]="true"
          (onClick)="voltarParaListagem()"
        />
        <p-button
          type="submit"
          label="Salvar Unidade"
          icon="pi pi-check"
          [loading]="salvando()"
          styleClass="shadow-sm"
        />
      </div>
    </form>
  </p-card>
</div>
